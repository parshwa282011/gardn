<!DOCTYPE html>
<html>
    <head>
        <link href="/favicon.ico" rel="icon" sizes="any">
        <link href="/logo.png" rel="icon" type="image/png">
        <link href="/apple-touch-icon.png" rel="apple-touch-icon">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
        <link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet" type="text/css">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                overflow: hidden;
                user-select: none;
            }
            #canvas {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                cursor: default;
            }
            #loading-bar {
                position: absolute;
                top: 0%;
                left: 0%;
                width: 100%;
                height: 100%;
                background-color: #000000;
            }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                font-size: 48pt;
                font-family: sans-serif;
                transform: translate(-50%, -50%);
                color: #ffffff;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
    <div id="loading-bar">
        <span id="loading">Loading</span>
    </div>
    <div id="font-loader" style="font-family: Ubuntu;">hello!</div>
    <canvas id="canvas" width="0" height="0"></canvas>
    <script>
        // Login handoff. The Parteria page opens /gardn/#uuid=...&plp=... so that this page
        // has the login even when the browser does not share localStorage between the two
        // (tracking prevention, a private window, another host). It is taken out of the
        // address at once, kept in a variable (and in sessionStorage when that works) for
        // Socket.cc to read, and nothing else uses it.
        (() => {
            const find = (key) => {
                const m = new RegExp('[#&]' + key + '=([^&]*)').exec(window.location.hash || '');
                if (!m) return '';
                try { return decodeURIComponent(m[1]).slice(0, 300); } catch (e) { return ''; }
            };
            const uuid = find('uuid'), plp = find('plp');
            if (uuid && plp) {
                window.gardnLogin = { uuid: uuid, plp: plp };
                try { window.sessionStorage['gardn_uuid'] = uuid; window.sessionStorage['gardn_PL-P'] = plp; } catch (e) {}
            }
            if (window.location.hash)
                window.history.replaceState(null, '', window.location.pathname + window.location.search);

            // Nobody gets in without a login: the page /login (same site, served next to this
            // one) logs in, signs up and confirms the email, then brings the player back here.
            // Whether the login still works is up to the servers; when they say no (Socket.cc)
            // the player is sent there too.
            let loggedIn = !!window.gardnLogin;
            try { loggedIn = loggedIn || !!(window.sessionStorage['gardn_uuid'] && window.sessionStorage['gardn_PL-P']); } catch (e) {}
            try { loggedIn = loggedIn || !!(window.localStorage['uuid'] && window.localStorage['PL-P']); } catch (e) {}
            if (!loggedIn) {
                window.gardnRedirecting = true;
                window.location.replace('/login?next=' + encodeURIComponent(window.location.pathname));
            }
        })();
    </script>
    <script>
        // The names here are global in the page, and so are the names of the minified
        // gardn-client.js that is loaded next: a plain "v" here clashed with its own
        // top level "v" ("Identifier 'v' has already been declared"), the script never ran
        // and the error handler reloaded the page for ever. Keep these names unlikely.
        const versionHash = '0';
        let gardnPageV = versionHash;
        try { gardnPageV = localStorage['version_hash'] || versionHash; } catch (e) {}
        var Module = {};
        Module.locateFile = (file, prefix) => prefix + file + '?v=' + gardnPageV;
        window.onerror = window.onunhandledrejection = () => {
            if (versionHash === '0') return;
            // an outdated page reloads to get the new one, but only once every ten
            // seconds: a real error must not turn into a reload loop
            let last = 0;
            try { last = Number(window.sessionStorage['gardn_reload'] || 0); } catch (e) {}
            if (Date.now() - last < 10000) return;
            try { window.sessionStorage['gardn_reload'] = String(Date.now()); } catch (e) {}
            try { delete window.localStorage['version_hash']; } catch (e) {}
            window.location.reload();
        };
        document.addEventListener("DOMContentLoaded", () => {
            if (window.gardnRedirecting) return;
            const script = document.createElement('script');
            script.src = 'gardn-client.js?v=' + gardnPageV;
            script.async = true;
            document.body.appendChild(script);
        });
    </script>
    </body>
</html>
